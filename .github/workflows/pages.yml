name: Verify and deploy to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'app/**', 'scripts/**', 'tests/**', 'package*.json', 'playwright.config.js', '.github/workflows/pages.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
        env:
          CI: 'true'
  admin-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start -x studio,edge-runtime,logflare,vector,imgproxy
      - run: sudo apt-get install -y postgresql-client
      - run: npx playwright install --with-deps chromium
      - run: npm run test:admin
        env:
          CI: 'true'
  deploy:
    needs: [verify, admin-e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The new app is published as a preview next to the live site: /overcomers/app/
      - run: npm run app:build && cp -R app/dist site/app
      # /admin/ is the new app's Admin Console (app/src/features/admin).
      - name: Admin Console redirect
        run: |
          mkdir -p site/admin
          cat > site/admin/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Admin Console</title><meta name="robots" content="noindex">
          <meta http-equiv="refresh" content="0; url=../app/#/admin/content">
          <script>location.replace('../app/#/admin/content')</script>
          </head><body><p><a href="../app/#/admin/content">Opening the Admin Console…</a></p></body></html>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
